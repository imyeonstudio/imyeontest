<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IMYEON STUDIO | 관리자 센터</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: { sans: ["Pretendard", "sans-serif"] },
                    colors: {
                        "imyeon-black": "#0a0a0a",
                        "imyeon-dark": "#141414",
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            background-color: #0a0a0a;
            color: white;
        }
        input:focus, textarea:focus {
            border-color: #fff !important;
            outline: none !important;
            ring: 1px solid #fff !important;
        }
        #auth-overlay {
            position: fixed; inset: 0; background: #0a0a0a; z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="antialiased selection:bg-white selection:text-black">

    <div id="auth-overlay">
        <div class="bg-imyeon-dark p-8 md:p-12 rounded-3xl border border-white/10 w-full max-w-md shadow-2xl">
            <div class="text-center mb-10">
                <div class="text-xl font-black tracking-widest uppercase text-white mb-2">IMYEON <span class="text-xs font-light text-gray-500">ADMIN</span></div>
                <p class="text-gray-400 text-xs tracking-widest uppercase text-[10px]">Access Restricted</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500 mb-2 ml-1">Email Address</label>
                    <input type="email" id="email" placeholder="이메일을 입력하세요" 
                        class="w-full p-4 bg-imyeon-black border border-white/10 rounded-xl text-white placeholder:text-gray-700 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500 mb-2 ml-1">Password</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" 
                        class="w-full p-4 bg-imyeon-black border border-white/10 rounded-xl text-white placeholder:text-gray-700 transition">
                </div>
                
                <div class="pt-4 space-y-3">
                    <button id="loginBtn" onclick="handleLogin()" 
                        class="w-full bg-white text-black py-4 rounded-xl font-bold uppercase tracking-widest text-sm hover:bg-gray-200 transition-colors">
                        로그인
                    </button>
                    <button id="signupBtn" onclick="handleSignup()" 
                        class="w-full border border-white/10 text-gray-400 py-4 rounded-xl font-bold uppercase tracking-widest text-sm hover:bg-white/5 transition-colors">
                        회원가입 신청
                    </button>
                </div>
                <p id="auth-msg" class="mt-4 text-xs text-center text-red-500 font-medium h-4"></p>
            </div>
        </div>
    </div>

    <div id="admin-content" class="hidden">
        <nav class="fixed top-0 w-full z-50 flex justify-between items-center px-6 md:px-16 py-6 border-b border-white/10 bg-imyeon-black/80 backdrop-blur-sm">
            <div class="text-xl font-black tracking-widest uppercase text-white">IMYEON <span class="text-xs font-light text-gray-500">ADMIN</span></div>
            <div class="flex items-center gap-6">
                <button onclick="handleLogout()" class="text-[10px] text-gray-500 hover:text-white transition-colors uppercase tracking-widest font-bold">로그아웃</button>
                <a href="index.html" class="text-xs text-gray-400 hover:text-white transition-colors uppercase tracking-widest font-bold">메인 바로가기 →</a>
            </div>
        </nav>

        <main class="min-h-screen flex items-center justify-center px-4 pt-24 pb-12">
            <div class="bg-imyeon-dark w-full max-w-xl p-8 md:p-12 rounded-3xl border border-white/10 shadow-2xl">
                <div class="mb-10 pb-6 border-b border-white/10">
                    <span class="font-bold tracking-[0.3em] uppercase text-[10px] text-gray-500 block mb-2">Internal Management</span>
                    <h1 class="text-3xl md:text-4xl font-black tracking-tighter leading-tight break-keep">메인 문구 수정</h1>
                    <p class="text-gray-400 text-sm font-light leading-relaxed mt-4 break-keep">
                        입력한 내용이 홈페이지 메인 타이틀에 실시간으로 반영됩니다.
                    </p>
                </div>

                <div class="space-y-6">
                    <div>
                        <label for="titleInput" class="block text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-3 ml-1">New Main Title</label>
                        <textarea id="titleInput" rows="4" 
                            class="w-full p-4 bg-imyeon-black border border-white/10 rounded-xl text-white placeholder:text-gray-700 focus:border-white focus:ring-1 focus:ring-white transition resize-none break-keep"
                            placeholder="예: 디자인의 시작은 기획입니다"></textarea>
                    </div>
                    <button onclick="saveToFirebase()" 
                        class="w-full inline-block bg-white text-black text-center py-4 rounded-xl hover:bg-gray-200 transition-colors uppercase tracking-widest font-bold text-sm shadow-lg">
                        홈페이지 업데이트 적용
                    </button>
                </div>
            </div>
        </main>

        <footer class="text-center p-6 text-[10px] text-gray-600 border-t border-white/10 tracking-widest uppercase">
            © 2026 Design Studio IMYEON. Secure Admin Panel
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGAnKh-SIOflCLFI7fDzViON8k-0-RY_s",
            authDomain: "imyeontest.firebaseapp.com",
            databaseURL: "https://imyeontest-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "imyeontest",
            storageBucket: "imyeontest.firebasestorage.app",
            messagingSenderId: "55529187023",
            appId: "1:55529187023:web:de07ae1f7ce459e36079ba",
            measurementId: "G-K4WGRY1XQ5"
        };

        // 초기화 확인용 로직 추가
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getDatabase(app);
        } catch (e) {
            console.error("Firebase 초기화 오류:", e);
        }

        // 전역 함수 등록
        window.auth = auth;

        // [상태 감지]
        onAuthStateChanged(auth, async (user) => {
            const overlay = document.getElementById('auth-overlay');
            const content = document.getElementById('admin-content');
            const msg = document.getElementById('auth-msg');

            if (user) {
                try {
                    const snapshot = await get(ref(db, 'users/' + user.uid));
                    const userData = snapshot.val();

                    if (userData && userData.approved === true) {
                        overlay.classList.add('hidden');
                        content.classList.remove('hidden');
                        msg.innerText = "";
                    } else {
                        // 승인되지 않은 유저 처리
                        if (userData) {
                            alert("아직 승인되지 않은 회원입니다. 대표님께 승인 요청을 하세요.");
                        }
                        await signOut(auth);
                    }
                } catch (error) {
                    console.error("DB 조회 오류:", error);
                    await signOut(auth);
                }
            } else {
                overlay.classList.remove('hidden');
                content.classList.add('hidden');
            }
        });

        // [회원가입]
        window.handleSignup = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("정보를 모두 입력해주세요.");

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await set(ref(db, 'users/' + userCredential.user.uid), {
                    email: email,
                    approved: false,
                    requestDate: new Date().toISOString()
                });
                alert("회원가입 신청이 완료되었습니다. 대표님의 승인 후 로그인이 가능합니다.");
                await signOut(auth);
            } catch (error) {
                console.error("회원가입 오류:", error);
                alert("신청 실패: " + error.code);
            }
        }

        // [로그인]
        window.handleLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');
            if(!email || !password) return alert("정보를 모두 입력해주세요.");

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("로그인 오류:", error);
                msg.innerText = "이메일 또는 비밀번호가 올바르지 않습니다.";
            }
        }

        // [로그아웃]
        window.handleLogout = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("로그아웃 오류:", error);
            }
        }

        // [저장]
        window.saveToFirebase = function() {
            const newText = document.getElementById('titleInput').value;
            if(!newText) return alert("내용을 입력해주세요!");

            set(ref(db, 'siteData/'), {
                mainTitle: newText
            }).then(() => {
                alert("🎉 업데이트 완료! 메인 페이지를 확인해보세요.");
            }).catch((error) => {
                alert("❌ 권한이 없거나 오류가 발생했습니다: " + error.message);
            });
        }
    </script>
</body>
</html>
